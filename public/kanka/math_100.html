<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100ます計算</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP','IPAGothic',sans-serif;background:#fff5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.back{align-self:flex-start;font-size:10pt;color:#c0392b;text-decoration:none;background:white;padding:6px 14px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:16px}
h1{font-size:16pt;font-weight:700;color:#c0392b;margin-bottom:16px}
.mode-btns{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{padding:8px 18px;border-radius:20px;border:2px solid #c0392b;font-size:10pt;font-weight:700;cursor:pointer;background:white;color:#c0392b}
.mode-btn.active{background:#c0392b;color:white}

/* スタート画面 */
.start-screen{background:white;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);padding:28px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.start-title{font-size:14pt;font-weight:700;color:#1a1a2e}
.start-desc{font-size:10pt;color:#888;line-height:1.6}
.best-time{font-size:10pt;color:#aaa}
.best-val{color:#c0392b;font-weight:700;font-size:14pt}
.btn-start{background:#c0392b;color:white;border:none;padding:14px 40px;border-radius:8px;font-size:14pt;font-weight:700;cursor:pointer;width:100%}

/* ゲーム画面 */
.game-screen{display:none;flex-direction:column;align-items:center;gap:12px;width:100%}
.timer-bar{background:white;border-radius:12px;padding:12px 20px;width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.timer{font-size:24pt;font-weight:700;color:#c0392b;font-family:'Arial',sans-serif}
.progress-info{font-size:10pt;color:#aaa}

/* 100ますグリッド */
.grid-wrap{overflow-x:auto;width:100%}
table{border-collapse:collapse;margin:0 auto}
th{background:#c0392b;color:white;font-size:11pt;font-weight:700;width:44px;height:44px;text-align:center;font-family:'Arial',sans-serif}
th.corner{background:#1a1a2e}
td{border:1px solid #e0d0cc;width:44px;height:44px;text-align:center;padding:0}
td input{
  width:100%;height:100%;border:none;text-align:center;
  font-size:12pt;font-weight:700;color:#1a1a2e;font-family:'Arial',sans-serif;
  background:transparent;outline:none;
}
td input.correct{background:#f0fff4;color:#27ae60}
td input.wrong{background:#fff5f5;color:#c0392b}
td input:focus{background:#fff8e0}

/* 結果画面 */
.result-screen{background:white;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);padding:32px 24px;width:100%;max-width:400px;display:none;flex-direction:column;align-items:center;gap:16px;text-align:center}
.result-time{font-size:48pt;font-weight:700;color:#c0392b;line-height:1}
.result-unit{font-size:14pt;color:#aaa}
.result-score{font-size:14pt;color:#555}
.new-record{font-size:12pt;font-weight:700;color:#f39c12;display:none}
.btn-retry{background:#c0392b;color:white;padding:12px 32px;border-radius:8px;border:none;font-size:12pt;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>
<a class="back" href="math.html">← 戻る</a>
<h1>⚡ 100ます計算</h1>
<div class="mode-btns">
  <button class="mode-btn active" id="modeAdd" onclick="setMode('add')">たし算</button>
  <button class="mode-btn" id="modeSub" onclick="setMode('sub')">ひき算</button>
  <button class="mode-btn" id="modeMul" onclick="setMode('mul')">かけ算</button>
</div>

<div class="start-screen" id="startScreen">
  <div class="start-title" id="startTitle">たし算 100ます計算</div>
  <div class="start-desc">縦の数と横の数を計算して<br>100マスを埋めよう！</div>
  <div class="best-time">ベストタイム：<span class="best-val" id="bestTime">--</span></div>
  <button class="btn-start" onclick="startGame()">スタート！</button>
</div>

<div class="game-screen" id="gameScreen">
  <div class="timer-bar">
    <div class="timer" id="timer">0:00</div>
    <div class="progress-info" id="progressInfo">0 / 100</div>
  </div>
  <div class="grid-wrap">
    <table id="grid"></table>
  </div>
</div>

<div class="result-screen" id="resultScreen">
  <div>🎉 完成！</div>
  <div class="result-time" id="resultTime">0:00</div>
  <div class="result-unit">分:秒</div>
  <div class="result-score" id="resultScore">正解: 100 / 100</div>
  <div class="new-record" id="newRecord">🏆 新記録！</div>
  <button class="btn-retry" onclick="retry()">もういちど</button>
</div>

<script>
let mode='add';
let timerInterval=null;
let seconds=0;
let answers=[];
let rowNums=[], colNums=[];
let filled=0;
const bestTimes={add:null,sub:null,mul:null};

const modeLabels={add:'たし算',sub:'ひき算',mul:'かけ算'};

function setMode(m){
  mode=m;
  ['add','sub','mul'].forEach(k=>{
    document.getElementById('mode'+k.charAt(0).toUpperCase()+k.slice(1)).className='mode-btn'+(k===m?' active':'');
  });
  document.getElementById('startTitle').textContent=modeLabels[m]+' 100ます計算';
  updateBestTime();
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
}

function updateBestTime(){
  const b=bestTimes[mode];
  document.getElementById('bestTime').textContent=b?formatTime(b):'--';
}

function formatTime(s){
  const m=Math.floor(s/60);
  return m+':'+(s%60).toString().padStart(2,'0');
}

function calcAnswer(r,c){
  if(mode==='add') return r+c;
  if(mode==='sub') return r-c;
  if(mode==='mul') return r*c;
}

function genNums(){
  if(mode==='add'||mode==='sub'){
    rowNums=Array.from({length:10},(_,i)=>i+1);
    colNums=Array.from({length:10},(_,i)=>i+1);
    // シャッフル
    rowNums.sort(()=>Math.random()-0.5);
    colNums.sort(()=>Math.random()-0.5);
    if(mode==='sub'){
      // ひき算は結果が負にならないように行>列
      rowNums=Array.from({length:10},(_,i)=>i+1).sort(()=>Math.random()-0.5).map(n=>n+5);
      colNums=Array.from({length:10},(_,i)=>i+1).sort(()=>Math.random()-0.5);
    }
  } else {
    rowNums=Array.from({length:10},(_,i)=>i+1).sort(()=>Math.random()-0.5);
    colNums=Array.from({length:10},(_,i)=>i+1).sort(()=>Math.random()-0.5);
  }
}

function buildGrid(){
  const table=document.getElementById('grid');
  table.innerHTML='';
  answers=[];
  filled=0;

  // ヘッダー行
  const headerRow=document.createElement('tr');
  const cornerTh=document.createElement('th');
  cornerTh.className='corner';
  cornerTh.textContent=mode==='add'?'+':mode==='sub'?'-':'×';
  headerRow.appendChild(cornerTh);
  colNums.forEach(c=>{
    const th=document.createElement('th');
    th.textContent=c;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  // データ行
  rowNums.forEach((r,ri)=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th');
    th.textContent=r;
    tr.appendChild(th);
    colNums.forEach((c,ci)=>{
      const td=document.createElement('td');
      const input=document.createElement('input');
      input.type='number';
      input.id=`cell_${ri}_${ci}`;
      const ans=calcAnswer(r,c);
      input.dataset.ans=ans;
      input.addEventListener('input',()=>checkCell(input,ri,ci));
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key==='\t') focusNext(ri,ci);
      });
      td.appendChild(input);
      tr.appendChild(td);
      answers.push(ans);
    });
    table.appendChild(tr);
  });
}

function checkCell(input,ri,ci){
  const ans=parseInt(input.dataset.ans);
  const val=parseInt(input.value);
  if(isNaN(val)){input.className='';return;}
  if(val===ans){
    input.className='correct';
    filled++;
    document.getElementById('progressInfo').textContent=filled+' / 100';
    focusNext(ri,ci);
    if(filled>=100) finishGame();
  } else {
    input.className='wrong';
  }
}

function focusNext(ri,ci){
  let nci=ci+1, nri=ri;
  if(nci>=10){nci=0;nri=ri+1;}
  if(nri>=10) return;
  const next=document.getElementById(`cell_${nri}_${nci}`);
  if(next&&next.className!=='correct') next.focus();
  else focusNext(nri,nci);
}

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  document.getElementById('resultScreen').style.display='none';
  genNums();
  buildGrid();
  seconds=0;
  filled=0;
  document.getElementById('progressInfo').textContent='0 / 100';
  document.getElementById('timer').textContent='0:00';
  timerInterval=setInterval(()=>{
    seconds++;
    document.getElementById('timer').textContent=formatTime(seconds);
  },1000);
  // 最初のセルにフォーカス
  setTimeout(()=>{
    const first=document.getElementById('cell_0_0');
    if(first) first.focus();
  },100);
}

function finishGame(){
  clearInterval(timerInterval);timerInterval=null;
  // 正解数カウント
  let correct=0;
  for(let ri=0;ri<10;ri++){
    for(let ci=0;ci<10;ci++){
      const input=document.getElementById(`cell_${ri}_${ci}`);
      if(input&&input.className==='correct') correct++;
    }
  }
  document.getElementById('gameScreen').style.display='none';
  const rs=document.getElementById('resultScreen');
  rs.style.display='flex';
  document.getElementById('resultTime').textContent=formatTime(seconds);
  document.getElementById('resultScore').textContent='正解: '+correct+' / 100';

  const nr=document.getElementById('newRecord');
  if(!bestTimes[mode]||seconds<bestTimes[mode]){
    bestTimes[mode]=seconds;
    nr.style.display='block';
  } else {
    nr.style.display='none';
  }
}

function retry(){
  document.getElementById('resultScreen').style.display='none';
  updateBestTime();
  document.getElementById('startScreen').style.display='flex';
}

updateBestTime();
</script>
</body>
</html>
