<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おうちのひととメッセージ</title>
<style>
:root{--theme:#2980b9}
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Maru Gothic',sans-serif;background:#FFF9F3;color:#3A3A3A;height:100vh;display:flex;flex-direction:column}
.header{background:var(--theme);color:white;padding:14px 16px;display:flex;align-items:center;gap:10px}
.back{color:white;text-decoration:none;font-size:16pt}
.header-title{font-size:14pt;font-weight:700}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:13pt;line-height:1.5;white-space:pre-wrap}
.msg.from-parent{align-self:flex-start;background:white;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.msg.from-child{align-self:flex-end;background:var(--theme);color:white;border-bottom-right-radius:4px}
.msg-name{font-size:9pt;opacity:0.8;margin-bottom:3px;font-weight:700}
.msg-time{font-size:8pt;opacity:0.6;margin-top:4px}
.empty{text-align:center;color:#bbb;font-size:11pt;margin-top:50px}
.quick-btns{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
.quick-btn{background:white;border:2px solid var(--theme);color:var(--theme);border-radius:20px;padding:10px 16px;font-size:11pt;font-weight:700;cursor:pointer;font-family:inherit}
.input-row{display:flex;gap:8px;padding:12px 16px}
.input-box{flex:1;border:2px solid #eee;border-radius:24px;padding:12px 18px;font-size:13pt;font-family:inherit;outline:none}
.input-box:focus{border-color:var(--theme)}
.send-btn{background:var(--theme);color:white;border:none;border-radius:50%;width:50px;height:50px;font-size:20px;cursor:pointer}
</style></head><body>
<div class="header"><a href="index.html" class="back">←</a>
  <div class="header-title">💌 おうちのひととメッセージ</div>
</div>
<div class="chat-area" id="chatArea"></div>
<div class="quick-btns" id="quickBtns"></div>
<div class="input-row">
  <input type="text" class="input-box" id="input" placeholder="メッセージを書いてね...">
  <button class="send-btn" onclick="send()">↑</button>
</div>
<script>
const OWNER='hanano';
const QUICK=['やったよ！','いまやってる','もうすこし','できた！','ありがとう','だいすき'];
function renderQuick(){document.getElementById('quickBtns').innerHTML=QUICK.map(function(q){return '<button class="quick-btn" onclick="sendText(\''+q+'\')">'+q+'</button>';}).join('');}
async function load(){
  try{
    const res=await fetch('/api/messages/'+OWNER);const msgs=await res.json();
    const area=document.getElementById('chatArea');
    if(!msgs.length){area.innerHTML='<div class="empty">まだメッセージはないよ😊<br>おうちのひとにおくってみよう！</div>';}
    else{area.innerHTML=msgs.map(function(m){var t=new Date(m.ts);var hm=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);var nm=m.from==='parent'?'<div class="msg-name">'+escapeHtml(m.name||'おうちのひと')+'</div>':'';return '<div class="msg from-'+m.from+'">'+nm+escapeHtml(m.text)+'<div class="msg-time">'+hm+'</div></div>';}).join('');}
    area.scrollTop=area.scrollHeight;
    await fetch('/api/messages/'+OWNER+'/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reader:'child'})});
  }catch(e){}
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function send(){var v=document.getElementById('input').value;if(v.trim()){sendText(v);document.getElementById('input').value='';}}
async function sendText(text){try{await fetch('/api/messages/'+OWNER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'child',text:text})});load();}catch(e){}}
document.getElementById('input').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
renderQuick();load();
setInterval(load,10000);
</script>
</body></html>
