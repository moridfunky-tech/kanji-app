<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字テスト 5年生 第1週</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f7fc;color:#1a1a2e}
.hdr{background:white;border-bottom:3px solid #2980b9;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:20pt;font-weight:700;color:#2980b9;font-family:serif}
.score-disp{font-size:14pt;color:#555}
.score-disp span{color:#2980b9;font-size:18pt;font-weight:700}
.main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.card{background:white;border:1.5px solid #b8d4e8;border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.card.ok{border-color:#27ae60;background:#f0fff4}
.card.ng{border-color:#2980b9;background:#f0f7fc}
.qnum{position:absolute;top:6px;right:8px;font-size:8pt;font-weight:700;color:#2980b9}
.qtext{font-size:11pt;text-align:center;line-height:1.8}
.hl{color:#2980b9;font-weight:700}
.cwrap{border:1px solid #b8d4e8;border-radius:4px;background:white;cursor:crosshair}
.cwrap canvas{display:block;width:120px;height:120px}
.clr{background:none;border:none;font-size:10px;color:#aaa;cursor:pointer;padding:2px 0;width:100%;text-align:center}
.clr:hover{color:#2980b9}
.res{font-size:11pt;font-weight:700;text-align:center;min-height:24px}
.res.ok{color:#27ae60}
.res.ng{color:#2980b9}
.res.wait{color:#aaa;font-size:9pt}
.btns{padding:12px 8px;text-align:center;display:flex;gap:12px;justify-content:center}
.gbtn{background:#2980b9;color:white;border:none;padding:12px 32px;border-radius:6px;font-size:14pt;font-weight:700;cursor:pointer}
.gbtn:disabled{opacity:0.5;cursor:not-allowed}
.back-btn{background:white;color:#2980b9;border:2px solid #2980b9;padding:12px 24px;border-radius:6px;font-size:12pt;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="../pet_points.js"></script>
</head>
<body>
<div class="hdr">
  <h1>土曜テスト　第1週</h1>
  <div class="score-disp">結果: <span id="sv">－</span> / 15</div>
</div>
<div class="main">
  <div class="grid" id="grid"></div>
  <div class="btns">
    <a class="back-btn" href="index.html">← 戻る</a>
    <button class="gbtn" id="gbtn" onclick="gradeAll()">採点する</button>
  </div>
  <div id="result-msg" style="text-align:center;margin-top:12px;font-size:14pt;font-weight:700;color:#2980b9"></div>
</div>
<script src="../kanji_weeks.js"></script>
<script>
let qs=[
  {q:'物',b:'じょ',a:'章を読む。',ans:'序'},
  {q:'',b:'なが',a:'い年月。',ans:'永'},
  {q:'出',b:'はん',a:'社で働く。',ans:'版'},
  {q:'原',b:'いん',a:'を調べる。',ans:'因'},
  {q:'',b:'い',a:'間にいる。',ans:'居'},
  {q:'貿',b:'えき',a:'の仕事。',ans:'易'},
  {q:'水',b:'えき',a:'を集める。',ans:'液'},
  {q:'利',b:'えき',a:'を得る。',ans:'益'},
  {q:'',b:'えん',a:'じる役者。',ans:'演'},
  {q:'',b:'おう',a:'復する道。',ans:'往'},
  {q:'',b:'おう',a:'えんする。',ans:'応'},
  {q:'',b:'おん',a:'師に会う。',ans:'恩'},
  {q:'',b:'かり',a:'の名前。',ans:'仮'},
  {q:'物',b:'か',a:'を調べる。',ans:'価'},
  {q:'許',b:'か',a:'をもらう。',ans:'可'},
];
const C=240,cvs=[],ctxs=[],drw=[];
const nums='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
function build(){
  const g=document.getElementById('grid');
  qs.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='card';d.id='c'+i;
    d.innerHTML=`<div class="qnum">${nums[i]}</div>
<div class="qtext">${q.q}<span class="hl">【${q.b}】</span>${q.a}</div>
<div class="cwrap"><canvas id="cv${i}" width="${C}" height="${C}"></canvas></div>
<button class="clr" onclick="clr(${i})">消す</button>
<div class="res" id="r${i}"></div>`;
    g.appendChild(d);
    const cv=document.getElementById('cv'+i);
    const ctx=cv.getContext('2d');
    ctx.strokeStyle='#1a1a2e';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';
    cvs.push(cv);ctxs.push(ctx);drw.push(false);
    drawGuide(i);
    cv.addEventListener('mousedown',e=>sd(i,e));
    cv.addEventListener('mousemove',e=>dr(i,e));
    cv.addEventListener('mouseup',()=>drw[i]=false);
    cv.addEventListener('mouseleave',()=>drw[i]=false);
    cv.addEventListener('touchstart',e=>{e.preventDefault();sd(i,e.touches[0]);},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault();dr(i,e.touches[0]);},{passive:false});
    cv.addEventListener('touchend',()=>drw[i]=false);
  });
}
function drawGuide(i){
  const c=ctxs[i];c.save();
  c.strokeStyle='#e8e0d8';c.lineWidth=1;
  c.beginPath();c.moveTo(C/2,0);c.lineTo(C/2,C);c.moveTo(0,C/2);c.lineTo(C,C/2);c.stroke();
  c.restore();
}
function pos(i,e){const r=cvs[i].getBoundingClientRect();return{x:(e.clientX-r.left)*(C/r.width),y:(e.clientY-r.top)*(C/r.height)};}
function sd(i,e){drw[i]=true;const p=pos(i,e);ctxs[i].beginPath();ctxs[i].moveTo(p.x,p.y);}
function dr(i,e){if(!drw[i])return;const p=pos(i,e);ctxs[i].lineTo(p.x,p.y);ctxs[i].stroke();}
function clr(i){
  ctxs[i].clearRect(0,0,C,C);drawGuide(i);
  document.getElementById('r'+i).textContent='';
  document.getElementById('r'+i).className='res';
  document.getElementById('c'+i).className='card';
}
async function gradeAll(){
  const btn=document.getElementById('gbtn');
  btn.disabled=true;btn.textContent='採点中...';
  const allResults=[];
  for(let i=0;i<qs.length;i++){
    const q=qs[i];
    const tmp=document.createElement('canvas');
    tmp.width=C;tmp.height=C;
    const tc=tmp.getContext('2d');
    tc.fillStyle='white';tc.fillRect(0,0,C,C);
    tc.drawImage(cvs[i],0,0);
    const img=tmp.toDataURL('image/jpeg',0.95).split(',')[1];
    const r=document.getElementById('r'+i);
    r.className='res wait';r.textContent='確認中...';
    try{
      const res=await fetch('/api/grade',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({imageData:img,answer:q.ans,question:q.q+q.b+q.a})
      });
      const d=await res.json();
      allResults.push({question:q.q+'【'+q.b+'】'+q.a,answer:q.ans,correct:d.correct,q:q.q,b:q.b,a:q.a,ans:q.ans});
      if(d.correct){
        r.className='res ok';r.textContent='⭕ 正解！';
        addPoints(10,'kanji','漢字テスト正解');
        document.getElementById('c'+i).className='card ok';
      }else{
        r.className='res ng';r.textContent='❌ 正解は「'+q.ans+'」';
        document.getElementById('c'+i).className='card ng';
      }
    }catch(e){
      r.className='res ng';r.textContent='エラー';
      allResults.push({question:q.q+'【'+q.b+'】'+q.a,answer:q.ans,correct:false,q:q.q,b:q.b,a:q.a,ans:q.ans});
    }
  }
  const score=allResults.filter(r=>r.correct).length;
  document.getElementById('sv').textContent=score;
  fetch('/api/activity/hanano',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'test'})}).catch(function(){});
  sendToLine(score, allResults);
  // 間違えた漢字を繰り越し保存
  try{
    const wrongList = allResults.filter(function(r){return !r.correct;}).map(function(r){return {q:r.q,b:r.b,a:r.a,ans:r.ans};});
    fetch('/api/carryover/hanano',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wrong:wrongList})}).catch(function(){});
  }catch(e){}
  btn.textContent='もう一度採点する';btn.disabled=false;
  const today=new Date().toLocaleDateString('ja-JP');
  try{
    const res=await fetch('/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({score,results:allResults,date:today,week:'第1週'})
    });
    const d=await res.json();
    const msg=score>=15?'満点！すばらしい！':score>=10?'よくできました！':'もう少し練習しよう！';
    document.getElementById('result-msg').textContent=`${score}/15点　${msg}　📧結果をメールで送りました！`;
  }catch(e){
    document.getElementById('result-msg').textContent=`${score}/15点　メール送信エラー`;
  }
}

async function sendToLine(score, allResults){
  try{
    // 全問のキャンバスを1枚に合成
    const cols=5, rows=Math.ceil(15/cols);
    const cell=200, pad=8, labelH=20;
    const W=cols*(cell+pad)+pad;
    const H=rows*(cell+labelH+pad)+pad+40;
    const big=document.createElement('canvas');
    big.width=W; big.height=H;
    const bx=big.getContext('2d');
    bx.fillStyle='#ffffff'; bx.fillRect(0,0,W,H);
    bx.fillStyle='#1a1a2e'; bx.font='bold 22px sans-serif';
    bx.fillText('羽梛 の漢字テスト  '+score+'/15点', pad, 28);
    for(let i=0;i<15;i++){
      const cv=document.getElementById('cv'+i);
      if(!cv) continue;
      const col=i%cols, row=Math.floor(i/cols);
      const x=pad+col*(cell+pad);
      const y=40+pad+row*(cell+labelH+pad);
      const r=allResults[i];
      bx.fillStyle=r&&r.correct?'#27ae60':'#c0392b';
      bx.font='bold 13px sans-serif';
      bx.fillText((i+1)+'. '+(r?(r.correct?'⭕':'❌'):''), x, y-4);
      bx.strokeStyle='#ccc'; bx.strokeRect(x,y,cell,cell);
      bx.drawImage(cv, x, y, cell, cell);
    }
    const imgData=big.toDataURL('image/jpeg',0.7).split(',')[1];
    // 画像保存してURL取得
    const saveRes=await fetch('/api/image/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:imgData})});
    const saveD=await saveRes.json();
    // LINE送信
    await fetch('/api/line/test-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({owner:'hanano',score:score,total:15,imageUrl:saveD.url})});
  }catch(e){ console.error('LINE送信エラー',e); }
}
// 週データと繰り越しを読み込んでからビルド
async function initWeek(){
  try{
    const wk = (typeof getCurrentWeek === 'function') ? getCurrentWeek() : 1;
    let weekQs = (typeof getWeekKanji === 'function') ? getWeekKanji('hanano', wk) : null;
    // 繰り越し（前週の間違い）を取得
    let carry = [];
    try{
      const cres = await fetch('/api/carryover/hanano');
      carry = await cres.json();
      if(!Array.isArray(carry)) carry = [];
      // 読み込んだ繰り越しは一旦クリア（今回のテスト結果で再設定される）
      if(carry.length){ fetch('/api/carryover/hanano',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wrong:[]})}).catch(function(){}); }
    }catch(e){ carry = []; }
    if(weekQs && weekQs.length){
      // 繰り越しを先頭に、その後に今週分。合計15問になるよう調整
      const combined = carry.concat(weekQs);
      qs = combined.slice(0, 15);
    }
    // 週表示があれば更新
    const wl = document.getElementById('weekLabel');
    if(wl) wl.textContent = '第' + wk + '週';
  }catch(e){ /* 失敗時は既定のqsを使う */ }
  build();
}
initWeek();
</script>
</body>
</html>
