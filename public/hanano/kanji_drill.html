<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5年生 漢字練習</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IPAGothic','Noto Sans JP',sans-serif;background:#ddd}
@page{size:A4 landscape;margin:8mm}
@media print{
  body{background:white}
  .done-bar,.back-bar{display:none !important}
  .page{page-break-after:always;box-shadow:none;margin:0}
}
.back-bar{max-width:277mm;margin:10px auto 0;padding:0 7mm}
.back-bar a{color:#2980b9;text-decoration:none;font-size:12pt;font-weight:700}
.loading{text-align:center;padding:60px;font-size:14pt;color:#2980b9}
.page{width:277mm;padding:6mm 7mm;background:white;margin:0 auto 12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.hdr-left{font-size:7pt;color:#888}
.hdr-day{font-size:13pt;font-weight:700;color:#2980b9;border:1.5px solid #2980b9;padding:1px 18px;border-radius:3px}
.hdr-right{font-size:8.5pt;color:#555;border:1px solid #bbb;padding:1px 8px;border-radius:3px}
.hdr-line{border-top:2px solid #2980b9;margin-bottom:5px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.kcard{border:1px solid #c8c0b8;border-radius:3px;display:flex;flex-direction:column;overflow:hidden}
.kcard-top{text-align:center;background:white;border-bottom:1px solid #ddd;padding:3px 2px 2px;color:#1a1a2e}
.kchar{font-size:34pt;color:#1a1a2e;font-weight:700;line-height:1;font-family:serif}
.kyomi{font-size:7pt;color:#1a1a2e;margin-top:1px}
.kcard-stroke{padding:3px 4px;border-bottom:1px solid #ece8e4}
.slbl{font-size:6.5pt;color:#999;margin-bottom:2px}
.srow{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.sempty{background:#f9f5f2;border:1px solid #e8e0d8;aspect-ratio:1}
.kcard-ex{padding:3px 4px;font-size:8.5pt;border-bottom:1px solid #ece8e4;background:white;line-height:1.4;height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hl{color:#2980b9;font-weight:700}
.kcard-prac{padding:3px 4px;flex:1}
.plbl{font-size:6.5pt;color:#aaa;margin-bottom:2px}
.pboxes{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pbox{height:28mm;border:1px solid #b8b8b8;background:white;position:relative}
.pbox::after{content:'';position:absolute;top:50%;left:0;right:0;border-top:0.5px dashed #ddd}
.pbox::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:0.5px dashed #ddd}
.pbox-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48pt;color:rgba(0,0,0,0.08);font-weight:700;white-space:nowrap;font-family:serif}
.done-bar{max-width:277mm;margin:0 auto 20px;padding:0 7mm;text-align:center}
.done-btn{background:#27ae60;color:white;border:none;padding:12px 32px;border-radius:24px;font-size:13pt;font-weight:700;cursor:pointer;font-family:inherit}
.done-btn:disabled{background:#95a5a6}
</style>
</head>
<body>
<div class="back-bar"><a href="index.html">← もどる</a></div>
<div id="content"><div class="loading">じゅんびちゅう...📝</div></div>
<div class="done-bar" id="doneBar" style="display:none">
  <button class="done-btn" id="doneBtn" onclick="markDone()">✅ れんしゅうしたよ！</button>
</div>

<script src="../kanji_weeks.js"></script>
<script>
const OWNER='hanano';
const THEME='#2980b9';

async function getStrokePaths(ch){
  const code = ch.codePointAt(0).toString(16).padStart(5,'0');
  const url = 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/'+code+'.svg';
  try{
    const res = await fetch(url);
    const text = await res.text();
    const matches = [...text.matchAll(/<path id="kvg:[^"]*"[^>]*\sd="([^"]+)"/g)];
    return matches.map(m=>m[1]);
  }catch(e){ return []; }
}

function strokeSvgs(paths){
  let svgs=[]; const n=paths.length;
  for(let i=0;i<n;i++){
    let p='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" style="width:100%;height:auto;display:block">';
    p+='<rect width="109" height="109" fill="#f9f5f2"/>';
    p+='<line x1="54.5" y1="0" x2="54.5" y2="109" stroke="#ddd" stroke-width="1"/>';
    p+='<line x1="0" y1="54.5" x2="109" y2="54.5" stroke="#ddd" stroke-width="1"/>';
    for(let j=0;j<i;j++){
      p+='<path d="'+paths[j]+'" stroke="#222" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    p+='<path d="'+paths[i]+'" stroke="'+THEME+'" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    p+='<text x="2" y="13" font-size="11" fill="'+THEME+'" font-weight="bold" font-family="sans-serif">('+(i+1)+')</text></svg>';
    svgs.push(p);
  }
  const total=Math.ceil(n/5)*5;
  for(let k=n;k<total;k++) svgs.push('<div class="sempty"></div>');
  return svgs.join('');
}

function makeCard(item, paths){
  const ex = item.q + '<span class="hl">【'+item.b+'】</span>' + item.a;
  const kakuNum = paths.length;
  const badge = item._carry ? '<div style="background:#e67e22;color:white;font-size:6.5pt;font-weight:700;padding:1px 0;text-align:center">⚠️ ふくしゅう</div>' : '';
  return '<div class="kcard"'+(item._carry?' style="border:2px solid #e67e22"':'')+'>'+badge+'<div class="kcard-top"><div class="kchar">'+item.ans+'</div>'+
    '<div class="kyomi">'+item.b+' '+kakuNum+'画</div></div>'+
    '<div class="kcard-stroke"><div class="slbl">◀ 書き順（'+kakuNum+'画）</div>'+
    '<div class="srow">'+strokeSvgs(paths)+'</div></div>'+
    '<div class="kcard-ex">'+ex+'</div>'+
    '<div class="kcard-prac"><div class="plbl">練習（8マス）</div>'+
    '<div class="pboxes">'+
    '<div class="pbox"></div>'+
    '<div class="pbox"><div class="pbox-ghost">'+item.ans+'</div></div>'+
    '<div class="pbox"></div><div class="pbox"></div><div class="pbox"></div>'+
    '<div class="pbox"></div><div class="pbox"></div><div class="pbox"></div>'+
    '</div></div></div>';
}

async function build(){
  const week = (typeof getCurrentWeek==='function') ? getCurrentWeek() : 1;
  let items = (typeof getWeekKanji==='function') ? getWeekKanji(OWNER, week) : [];
  if(!items || !items.length){
    document.getElementById('content').innerHTML='<div class="loading">データがありません</div>';
    return;
  }
  let carry=[];
  try{
    const cres=await fetch('/api/carryover/'+OWNER);
    carry=await cres.json();
    if(!Array.isArray(carry)) carry=[];
  }catch(e){ carry=[]; }
  carry.forEach(function(x){ x._carry=true; });
  const carrySet={}; carry.forEach(function(x){ carrySet[x.ans]=true; });
  items = carry.concat(items.filter(function(x){ return !carrySet[x.ans]; }));
  const days=['月曜日','火曜日','水曜日','木曜日','金曜日'];
  const paths = await Promise.all(items.slice(0,25).map(it=>getStrokePaths(it.ans)));
  let html='';
  for(let pg=0; pg<5; pg++){
    html+='<div class="page"><div class="page-hdr">'+
      '<div class="hdr-left">5年生 漢字練習 ／ 第'+week+'週　書き順: KanjiVG (CC BY-SA 3.0)</div>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
      '<div class="hdr-right">日にち：　　月　　日</div>'+
      '<div class="hdr-day">'+days[pg]+'</div></div></div>'+
      '<div class="hdr-line"></div><div class="grid5">';
    for(let i=pg*5; i<pg*5+5 && i<items.length; i++){
      html+=makeCard(items[i], paths[i]||[]);
    }
    html+='</div></div>';
  }
  document.getElementById('content').innerHTML=html;
  document.getElementById('doneBar').style.display='block';
}

async function markDone(){
  const btn=document.getElementById('doneBtn');
  btn.disabled=true; btn.textContent='きろくしたよ！🎉';
  try{
    await fetch('/api/activity/'+OWNER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'drill'})});
    await fetch('/api/pet/'+OWNER+'/addpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:10,type:'kanji',reason:'漢字練習'})}).catch(function(){});
  }catch(e){}
  setTimeout(function(){ btn.textContent='✅ れんしゅうしたよ！'; btn.disabled=false; }, 3000);
}

build();
</script>
</body>
</html>
