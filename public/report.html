<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森脇ファミリー 学習通知表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root { --cream:#F7F3EC; --ink:#1C1C1C; --ink-light:#555; --rule:#C8BFA8; --red:#C0392B; --blue:#2471A3; --gold:#B8860B; --green:#1E8449; --bg-red:#FEF0EF; --bg-blue:#EBF5FB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--cream); font-family:'Noto Sans JP',sans-serif; color:var(--ink); min-height:100vh; }
  .cover { background:var(--ink); color:white; padding:32px 24px 24px; text-align:center; position:relative; overflow:hidden; }
  .cover::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--red),var(--gold),var(--blue)); }
  .cover-back { position:absolute; left:16px; top:20px; color:white; text-decoration:none; font-size:16pt; }
  .cover-title { font-family:'Noto Serif JP',serif; font-size:22pt; font-weight:700; letter-spacing:0.15em; margin-bottom:6px; }
  .cover-sub { font-size:10pt; color:#aaa; letter-spacing:0.1em; }
  .cover-date { margin-top:12px; font-size:9pt; color:#888; border-top:1px solid #333; padding-top:10px; }
  .content { padding:20px 16px; max-width:900px; margin:0 auto; }
  .loading { text-align:center; padding:40px; color:var(--ink-light); }
  .children-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  @media (max-width:600px){ .children-grid{ grid-template-columns:1fr; } }
  .child-card { background:white; border-radius:4px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.08); border-top:4px solid var(--red); }
  .child-card.hanano { border-top-color:var(--blue); }
  .child-header { padding:14px 16px 10px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:12px; }
  .child-avatar { width:40px; height:40px; border-radius:50%; background:var(--bg-red); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .child-card.hanano .child-avatar { background:var(--bg-blue); }
  .child-name { font-family:'Noto Serif JP',serif; font-size:14pt; font-weight:700; }
  .child-grade { font-size:9pt; color:var(--ink-light); }
  .total-pt { padding:12px 16px; display:flex; align-items:baseline; gap:6px; border-bottom:1px solid var(--rule); }
  .pt-num { font-family:'Noto Serif JP',serif; font-size:32pt; font-weight:700; color:var(--red); line-height:1; }
  .child-card.hanano .pt-num { color:var(--blue); }
  .pt-label { font-size:10pt; color:var(--ink-light); }
  .pt-lap { margin-left:auto; font-size:9pt; color:var(--green); font-weight:700; }
  .subject-section { padding:12px 16px; border-bottom:1px solid var(--rule); }
  .section-label { font-size:8pt; letter-spacing:0.12em; color:var(--ink-light); margin-bottom:10px; font-weight:700; }
  .subject-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .subject-name { font-size:9pt; width:52px; flex-shrink:0; }
  .bar-track { flex:1; height:8px; background:#EEE; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width 0.8s ease; }
  .bar-kanji{background:var(--red);} .bar-math{background:var(--gold);} .bar-english{background:var(--green);} .bar-romaji{background:#8E44AD;} .bar-social{background:#16A085;}
  .bar-val { font-size:9pt; width:40px; text-align:right; color:var(--ink-light); }
  .weak-section { padding:12px 16px; border-bottom:1px solid var(--rule); }
  .weak-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .weak-kanji { background:#FEF9E7; border:1px solid #F0C040; border-radius:4px; padding:4px 8px; font-size:13pt; font-family:'Noto Serif JP',serif; position:relative; }
  .weak-kanji .miss-cnt { position:absolute; top:-6px; right:-6px; background:var(--red); color:white; font-size:7pt; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .empty-note { font-size:9pt; color:#bbb; padding:4px 0; }
  .task-section { background:white; border-radius:4px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:24px; }
  .task-title { font-family:'Noto Serif JP',serif; font-size:12pt; font-weight:700; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--rule); }
  .task-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px){ .task-grid{ grid-template-columns:1fr; } }
  .task-child-name { font-size:9pt; font-weight:700; color:var(--red); margin-bottom:8px; }
  .task-child.hanano .task-child-name { color:var(--blue); }
  .task-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--rule); font-size:9pt; }
  .task-item:last-child { border-bottom:none; }
  .task-kanji { font-family:'Noto Serif JP',serif; font-size:16pt; width:28px; }
  .task-miss { color:var(--red); font-weight:700; font-size:8pt; }
  .footer { text-align:center; padding:20px; font-size:8pt; color:var(--ink-light); border-top:1px solid var(--rule); margin-top:8px; }
</style>
</head>
<body>

<div class="cover">
  <a href="index.html" class="cover-back">←</a>
  <div class="cover-title">学　習　通　知　表</div>
  <div class="cover-sub">森脇ファミリー学習アプリ</div>
  <div class="cover-date" id="coverDate">2026年度</div>
</div>

<div class="content" id="content">
  <div class="loading">よみこみちゅう...</div>
</div>

<div class="footer">森脇ファミリー学習アプリ　成績レポート　© 2026</div>

<script>
const CHILDREN = {
  kanka:  { name:'カンカン', grade:'小学3年生', emoji:'🦁', cls:'' },
  hanano: { name:'羽梛',    grade:'小学5年生', emoji:'🌸', cls:'hanano' }
};
const SUBJECTS = [
  {key:'kanji', name:'漢字', cls:'bar-kanji'},
  {key:'math', name:'算数', cls:'bar-math'},
  {key:'english', name:'英語', cls:'bar-english'},
  {key:'romaji', name:'ローマ字', cls:'bar-romaji'},
  {key:'social', name:'社会', cls:'bar-social'},
];

function fmtDate(){
  const d = new Date();
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 げんざい';
}

function childCard(owner, data){
  const info = CHILDREN[owner];
  const by = data.ptsByType || {};
  const maxPt = Math.max(50, by.kanji||0, by.math||0, by.english||0, by.romaji||0, by.social||0);

  let subjects = SUBJECTS.map(s=>{
    const v = by[s.key] || 0;
    const w = Math.round(v / maxPt * 100);
    return '<div class="subject-row"><div class="subject-name">'+s.name+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+s.cls+'" style="width:'+w+'%"></div></div>'+
      '<div class="bar-val">'+v+'pt</div></div>';
  }).join('');

  let weak;
  if(data.mistakes && data.mistakes.length){
    weak = '<div class="weak-grid">' + data.mistakes.slice(0,5).map(m=>
      '<div class="weak-kanji">'+m.k+'<span class="miss-cnt">'+(m.cnt||1)+'</span></div>'
    ).join('') + '</div>';
  } else {
    weak = '<div class="empty-note">まだ にがてな漢字は ないよ</div>';
  }

  return '<div class="child-card '+info.cls+'">'+
    '<div class="child-header"><div class="child-avatar">'+info.emoji+'</div>'+
      '<div><div class="child-name">'+info.name+'</div><div class="child-grade">'+info.grade+'</div></div></div>'+
    '<div class="total-pt"><div class="pt-num">'+data.pts+'</div><div class="pt-label">pt</div>'+
      '<div class="pt-lap">🗾 '+data.laps+'しゅう</div></div>'+
    '<div class="subject-section"><div class="section-label">今週の がくしゅう</div>'+weekCalendar(data.activity)+'</div>'+
    '<div class="subject-section"><div class="section-label">科目別ポイント</div>'+subjects+'</div>'+
    '<div class="weak-section"><div class="section-label">苦手な漢字 TOP5</div>'+weak+'</div>'+
  '</div>';
}

// 今週（月〜土）のカレンダー
function weekCalendar(activity){
  activity = activity || {};
  const days = ['月','火','水','木','金','土'];
  // 今週の月曜を求める（日本時間）
  const now = new Date(Date.now() + 9*60*60*1000);
  const dow = (now.getUTCDay() + 6) % 7; // 月=0
  const monday = new Date(now);
  monday.setUTCDate(now.getUTCDate() - dow);

  let drillRow = '<div style="display:flex;gap:3px;align-items:center"><div style="width:40px;font-size:8pt;color:#888">練習</div>';
  let testRow  = '<div style="display:flex;gap:3px;align-items:center;margin-top:4px"><div style="width:40px;font-size:8pt;color:#888">テスト</div>';
  let headRow  = '<div style="display:flex;gap:3px;align-items:center"><div style="width:40px"></div>';

  for(let i=0;i<6;i++){
    const d = new Date(monday);
    d.setUTCDate(monday.getUTCDate()+i);
    const key = d.toISOString().slice(0,10);
    const a = activity[key] || {};
    headRow  += '<div style="flex:1;text-align:center;font-size:8pt;color:#999">'+days[i]+'</div>';
    drillRow += '<div style="flex:1;text-align:center;font-size:12pt">'+(a.drill?'✅':'<span style="color:#ddd">・</span>')+'</div>';
    testRow  += '<div style="flex:1;text-align:center;font-size:12pt">'+(a.test?'✅':'<span style="color:#ddd">・</span>')+'</div>';
  }
  headRow+='</div>'; drillRow+='</div>'; testRow+='</div>';
  return headRow + drillRow + testRow;
}

function taskBlock(owner, data){
  const info = CHILDREN[owner];
  let items;
  if(data.mistakes && data.mistakes.length){
    items = data.mistakes.slice(0,3).map(m=>
      '<div class="task-item"><div class="task-kanji">'+m.k+'</div>'+
      '<div><div class="task-miss">'+(m.cnt||1)+'回まちがえた</div>'+
      '<div style="color:#888;font-size:8pt">よみ：'+(m.y||'')+'</div></div></div>'
    ).join('');
  } else {
    items = '<div class="empty-note">いまは とくに ありません😊</div>';
  }
  return '<div class="task-child '+info.cls+'"><div class="task-child-name">'+info.name+'</div>'+items+'</div>';
}

async function load(){
  document.getElementById('coverDate').textContent = fmtDate();
  try {
    const res = await fetch('/api/report');
    const data = await res.json();
    const k = data.kanka, h = data.hanano;
    let html = '<div class="children-grid">' + childCard('kanka', k) + childCard('hanano', h) + '</div>';
    html += '<div class="task-section"><div class="task-title">📝 来週の重点練習（自動生成）</div>'+
      '<div class="task-grid">' + taskBlock('kanka', k) + taskBlock('hanano', h) + '</div></div>';
    document.getElementById('content').innerHTML = html;
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">データを よみこめませんでした😢</div>';
  }
}
load();
</script>

</body>
</html>
