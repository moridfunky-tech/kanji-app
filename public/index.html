<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森脇ファミリー学習</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans JP','IPAGothic',sans-serif;
  background:#f7f4ef;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
}
h1{
  font-size:22pt;font-weight:700;color:#1a1a2e;
  margin-bottom:8px;text-align:center;letter-spacing:0.05em;
}
.subtitle{font-size:11pt;color:#888;margin-bottom:40px;text-align:center}
.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.card{
  background:white;border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
  padding:36px 40px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  text-decoration:none;color:inherit;
  transition:transform 0.15s,box-shadow 0.15s;
  min-width:200px;cursor:pointer;border:2px solid transparent;
}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,0.13)}
.card.kanka{border-color:#c0392b}
.card.hanano{border-color:#2980b9}
.card-icon{font-size:48pt;line-height:1}
.card-name{font-size:20pt;font-weight:700;color:#1a1a2e}
.card-grade{font-size:10pt;color:#aaa;font-weight:400}
.card-label{
  font-size:9pt;font-weight:700;padding:4px 14px;border-radius:20px;margin-top:4px;
}
.card.kanka .card-label{background:#fff0f0;color:#c0392b}
.card.hanano .card-label{background:#f0f7fc;color:#2980b9}
</style>
</head>
<body>
<h1>📚 もりきファミリー学習</h1>
<p class="subtitle">だれがやる？</p>
<div class="cards">
  <a class="card kanka" href="kanka/index.html">
    <div class="card-icon">🦁</div>
    <div class="card-name">カンカン</div>
    <div class="card-grade">小学3年生</div>
    <div class="card-label">3年生メニュー →</div>
  </a>
  <a class="card hanano" href="hanano/index.html">
    <div class="card-icon">🌸</div>
    <div class="card-name">羽梛</div>
    <div class="card-grade">小学5年生</div>
    <div class="card-label">5年生メニュー →</div>
  </a>
</div>
</body>
</html>
